name: Python Style Checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  core-style-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Run flake8 formatter check
      run: |
        flake8 src/*.py